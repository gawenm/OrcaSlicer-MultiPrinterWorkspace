name: Build OrcaSlicer dependencies
description: Install the pinned dependency recipes into the platform cache directory
inputs:
  arch:
    description: Build target architecture
  compiler:
    description: Windows application compiler
  self-hosted:
    description: Whether the job uses a self-hosted runner
    default: "false"
  cache-path:
    description: Workspace-relative dependency installation directory
    required: true
runs:
  using: composite
  steps:
    - name: setup dev on Windows
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v3

    - name: Build on Windows
      if: runner.os == 'Windows'
      working-directory: ${{ github.workspace }}
      run: |
          # Git checks out third-party submodules in deeply nested dependency directories.
          # Enable Windows long-path handling before CMake downloads dep_DataChannel.
          $gitConfigIndex = [int]$env:GIT_CONFIG_COUNT
          [Environment]::SetEnvironmentVariable("GIT_CONFIG_KEY_$gitConfigIndex", "core.longpaths")
          [Environment]::SetEnvironmentVariable("GIT_CONFIG_VALUE_$gitConfigIndex", "true")
          $env:GIT_CONFIG_COUNT = ($gitConfigIndex + 1).ToString()
          git config --bool --get core.longpaths
          if ($LASTEXITCODE -ne 0) { throw "Could not enable Git long paths" }
          if ("${{ inputs.self-hosted }}" -ne "true") {
            choco install strawberryperl
          }
          # cache-path is the install directory inside the deps build directory.
          $deps = (Split-Path "${{ github.workspace }}/${{ inputs.cache-path }}").Replace('\', '/')
          # -l compiles with Visual Studio's clang-cl and -x builds with Ninja; --msvc --msbuild is cl under the Visual Studio generator.
          $flags = if ("${{ inputs.compiler }}" -eq "clang") { "-l", "-x" } else { "--msvc", "--msbuild" }
          $buildScript = ".\build_win.bat"
          # OCCT can generate paths too long for Windows compilers.
          # Subst shortens compiler-visible paths without changing the cached files.
          $mappedDrive = $false
          if ("${{ inputs.self-hosted }}" -ne "true") {
            $drive = "O:"
            & subst.exe $drive "${{ github.workspace }}"
            if ($LASTEXITCODE -ne 0) { throw "Could not map short build path $drive" }
            $mappedDrive = $true
            $deps = ("${drive}/" + (Split-Path "${{ inputs.cache-path }}" -Parent)).Replace('\', '/')
            $buildScript = "${drive}\build_win.bat"
          }
          try {
            & $buildScript -d --arch ${{ inputs.arch }} --deps-dir $deps @flags
            $buildExitCode = $LASTEXITCODE
          } finally {
            if ($mappedDrive) { & subst.exe $drive /D }
          }
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      shell: pwsh

    - name: Build on Mac ${{ inputs.arch }}
      if: runner.os == 'macOS'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
          if [ "${{ inputs.self-hosted }}" != true ]; then
            brew install automake texinfo libtool pkgconf yasm nasm
          fi
          ./build_release_macos.sh -dx ${{ inputs.self-hosted != 'true' && '-j 3' || '' }} -a ${{ inputs.arch }} -t 10.15 -- "-DDESTDIR=$GITHUB_WORKSPACE/${{ inputs.cache-path }}"


    - name: Apt-Install Dependencies
      if: runner.os == 'Linux' && inputs.self-hosted != 'true'
      uses: ./.github/actions/apt-install-deps

    - name: Build on Ubuntu
      if: runner.os == 'Linux'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: ./build_linux.sh -drlL -- "-DDESTDIR=$GITHUB_WORKSPACE/${{ inputs.cache-path }}"
