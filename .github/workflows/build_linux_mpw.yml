name: Build Linux

on:
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: Build dependencies only (no installer or tests)
        type: boolean
        default: false

concurrency:
  group: mpw-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build_linux_x86_64:
    name: Build Linux x86_64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
      arch: ''
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit

  build_linux_aarch64:
    name: Build Linux aarch64
    if: ${{ !vars.SELF_HOSTED }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ 'ubuntu-24.04-arm' }}
      arch: aarch64
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit

  unit_tests_linux_x86_64:
    name: Linux x86_64 / Unit Tests
    needs: build_linux_x86_64
    if: ${{ !cancelled() && success() && !inputs.build-deps-only }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04' }}
      artifact: ${{ github.sha }}-tests-linux-x86_64

  unit_tests_linux_aarch64:
    name: Linux ARM64 / Unit Tests
    needs: build_linux_aarch64
    if: ${{ !cancelled() && success() && !inputs.build-deps-only && !vars.SELF_HOSTED }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ubuntu-24.04-arm
      artifact: ${{ github.sha }}-tests-linux-aarch64

  slice_check_linux:
    name: Linux / Profile slice regression
    needs: [build_linux_x86_64, build_linux_aarch64]
    if: ${{ !cancelled() && ((vars.SELF_HOSTED && needs.build_linux_x86_64.result == 'success') || needs.build_linux_aarch64.result == 'success') && !inputs.build-deps-only }}
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the matching profile validator
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-profile-validator-linux-${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }}
          path: validator-bin
      - name: Check shipped profiles and slicing expressions
        timeout-minutes: 60
        shell: bash
        run: |
          chmod +x validator-bin/OrcaSlicer_profile_validator
          ./validator-bin/OrcaSlicer_profile_validator -p "${{ github.workspace }}/resources/profiles" -s -l 2

  package_mpw_linux:
    name: Package Arch + Debian x86_64
    needs: build_linux_x86_64
    if: ${{ !cancelled() && success() && !inputs.build-deps-only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Linux_ubuntu_*
          path: appimages
      - name: Package native Linux installers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          mapfile -t images < <(find appimages -type f -name '*.AppImage' ! -name '*aarch64*')
          if (( ${#images[@]} != 1 )); then
            echo 'Expected exactly one x86-64 AppImage' >&2
            exit 1
          fi
          version=$(sed -nE 's/^set\(SoftFever_VERSION "([0-9]+\.[0-9]+\.[0-9]+)[^"]*"\)$/\1/p' version.inc)
          bash scripts/package_mpw_linux.sh "${images[0]}" "$version" "$GITHUB_RUN_NUMBER" dist
      - uses: actions/upload-artifact@v7
        with:
          name: Orca-MPW-Arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Orca-MPW-Debian-amd64
          path: dist/*.deb
          if-no-files-found: error
