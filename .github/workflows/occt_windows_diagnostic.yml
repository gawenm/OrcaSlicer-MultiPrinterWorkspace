name: OCCT Windows Diagnostic

on:
  workflow_dispatch:
    inputs:
      pch:
        description: "Enable OCCT precompiled headers (match current Windows x64 build)"
        type: boolean
        default: true
      short_paths:
        description: "Use short source/build paths (disable to reproduce long-path failure)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  occt-tkgeomalgo:
    name: OCCT TKGeomAlgo (MSVC x64)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout MPW for OCCT configuration reference
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare OCCT 8.0.1 source
        run: |
          $ErrorActionPreference = 'Stop'
          $root = if ('${{ inputs.short_paths }}' -eq 'true') { 'C:\o' } else { Join-Path $env:GITHUB_WORKSPACE 'deps\build\dep_OCCT-prefix\src\dep_OCCT' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'occt.zip'
          Invoke-WebRequest 'https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V8_0_1.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '7c033d917ee8f040c0512d289dcc5f02c148889d5bac17c3e25639accb44f0da') { throw "OCCT archive hash mismatch: $hash" }
          $extract = Join-Path $env:RUNNER_TEMP 'occt-unzip'
          Expand-Archive $zip -DestinationPath $extract -Force
          $source = (Get-ChildItem $extract -Directory | Select-Object -First 1).FullName
          $dest = Join-Path $root 'src'
          Move-Item $source $dest
          "OCCT_SOURCE=$dest" >> $env:GITHUB_ENV
          "OCCT_BUILD=$(Join-Path $root 'build')" >> $env:GITHUB_ENV
          Write-Host "Source: $dest"

      - name: Configure OCCT TKGeomAlgo with MSVC
        run: |
          $ErrorActionPreference = 'Stop'
          $pch = if ('${{ inputs.pch }}' -eq 'true') { 'ON' } else { 'OFF' }
          cmake -S "$env:OCCT_SOURCE" -B "$env:OCCT_BUILD" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CXX_STANDARD=17 `
            -DBUILD_LIBRARY_TYPE=Shared `
            -DBUILD_USE_PCH=$pch `
            -DUSE_TK=OFF -DUSE_TBB=OFF -DUSE_FREETYPE=OFF -DUSE_FFMPEG=OFF -DUSE_VTK=OFF `
            -DBUILD_DOC_Overview=OFF `
            -DBUILD_MODULE_ApplicationFramework=OFF -DBUILD_MODULE_DataExchange=OFF `
            -DBUILD_MODULE_Draw=OFF -DBUILD_MODULE_FoundationClasses=OFF `
            -DBUILD_MODULE_ModelingAlgorithms=OFF -DBUILD_MODULE_ModelingData=OFF `
            -DBUILD_MODULE_Visualization=OFF `
            "-DBUILD_ADDITIONAL_TOOLKITS=TKGeomAlgo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -Path "$env:OCCT_BUILD/CMakeCache.txt" -Pattern 'BUILD_USE_PCH|CMAKE_CXX_COMPILER:|CMAKE_GENERATOR:' | ForEach-Object { $_.Line }

      - name: Compile TKGeomAlgo (diagnostic)
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build "$env:OCCT_BUILD" --config Release --target TKGeomAlgo --parallel 2 --verbose 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/occt-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occt-windows-diagnostic-${{ inputs.pch }}-${{ inputs.short_paths }}
          path: ${{ runner.temp }}/occt-build.log
          if-no-files-found: warn
          retention-days: 7
