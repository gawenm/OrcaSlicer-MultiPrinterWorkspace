name: MPW packaged CLI regression audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mpw_cli_artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  packaged-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout test fixtures matching promoted build
        uses: actions/checkout@v7
        with:
          ref: d1640777239198086e66b68324f9faaa5eabc97e
          lfs: true
      - name: Install runtime dependencies
        uses: ./.github/actions/apt-install-deps
      - name: Download exact PR-8 x86-64 artifact
        uses: actions/download-artifact@v8
        with:
          name: OrcaSlicer_Linux_ubuntu_2404_PR-8
          run-id: 45483076544
          github-token: ${{ github.token }}
          path: packaged
      - name: Extract AppImage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find "$PWD/packaged" -type f -name '*.AppImage')
          test "${#images[@]}" -eq 1
          image="${images[0]}"
          chmod +x "$image"
          sha256sum "$image"
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract > /dev/null
          test -x "$RUNNER_TEMP/squashfs-root/AppRun"
          echo "ORCA_CLI=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Run all registered native CLI groups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cli-results
          passed=0
          failed=0
          skipped=0
          run_case() {
            local name="$1"; shift
            local rc=0
            timeout --kill-after=15s 950s bash "tests/cli/test_${name}.sh" "$ORCA_CLI" python3 "$@" > "cli-results/$name.log" 2>&1 || rc=$?
            cat "cli-results/$name.log"
            case "$rc" in
              0) result=PASS; passed=$((passed+1));;
              77) result=SKIP; skipped=$((skipped+1));;
              *) result=FAIL; failed=$((failed+1));;
            esac
            echo "| $name | $result | $rc |" >> "$GITHUB_STEP_SUMMARY"
          }
          echo '| Test group | Result | Exit |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          run_case cli_strict
          run_case cli_empty_project_config "$PWD"
          run_case cli_project_missing_keys "$PWD/resources/profiles/BBL"
          run_case cli_arrange_rotations "$PWD/resources/profiles/BBL"
          run_case cli_no_suitable_objects "$PWD/resources/profiles/BBL"
          run_case cli_filament_colour_count "$PWD/resources/profiles/BBL"
          run_case cli_load_filaments_count "$PWD/resources/profiles/BBL"
          run_case cli_malformed_input
          run_case cli_nozzle_volume_type "$PWD/resources/profiles"
          echo "Passed=$passed Failed=$failed Skipped=$skipped" | tee cli-results/summary.txt
          cat cli-results/summary.txt >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
          test "$skipped" -eq 0
      - name: Upload CLI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpw-packaged-cli-results
          path: cli-results/
          if-no-files-found: warn
