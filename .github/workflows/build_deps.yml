name: Build dependencies only
on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        type: string
      compiler:
        type: string

jobs:
  build_deps:
    name: Build Deps
    runs-on: ${{ inputs.os }}
    concurrency:
      group: ${{ startsWith(inputs.os, 'orca-') && format('orca-build-directory-{0}', inputs.os) || format('deps-only-{0}-{1}-{2}', github.run_id, inputs.os, inputs.arch) }}
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true
      - name: Build dependencies
        uses: ./.github/actions/build-deps
        with:
          self-hosted: ${{ vars.SELF_HOSTED && 'true' || 'false' }}
          arch: ${{ inputs.arch }}
          compiler: ${{ inputs.compiler }}
          cache-path: ${{ inputs.cache-path }}
      - name: Save installed dependencies
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
      - name: Upload dependency diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-logs-${{ inputs.os }}-${{ inputs.arch || 'x86_64' }}
          path: deps/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 5
