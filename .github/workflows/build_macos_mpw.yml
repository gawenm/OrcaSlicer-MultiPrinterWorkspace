name: Build macOS

# Manually run this one platform without starting Build all.
# GitHub Actions -> Run workflow -> choose review/orca-mpw-v2.5.0.
on:
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: Build dependencies only (no installer or tests)
        type: boolean
        default: false

concurrency:
  group: mpw-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  build_macos_arch:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || (matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15') }}
      arch: ${{ matrix.arch }}
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit

  build_macos_universal:
    name: Package universal macOS DMG
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' && !inputs.build-deps-only }}
    uses: ./.github/workflows/build_orca.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-15' }}
      arch: universal
      macos-combine-only: true
    secrets: inherit

  unit_tests_macos_arm64:
    name: macOS ARM64 / Unit Tests
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' && !inputs.build-deps-only }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-macos-arm64' || 'macos-15' }}
      artifact: ${{ github.sha }}-tests-macos-arm64
      test-dir: build/arm64/tests
