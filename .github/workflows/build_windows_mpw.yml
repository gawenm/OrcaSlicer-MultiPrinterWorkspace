name: Build Windows

on:
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: Build dependencies only (no installer or tests)
        type: boolean
        default: false
      build-arm64:
        description: Also build and test Windows ARM64 (OCCT compiler workaround validation)
        type: boolean
        default: false

concurrency:
  group: mpw-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  checks: write

jobs:
  check_build_script:
    name: Validate Windows build scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'false'
      - name: Test build_win.bat
        shell: powershell
        run: .\scripts\test_build_win.ps1
      - name: Check exception throw info checks
        shell: powershell
        run: .\scripts\test_check_exception_throw_info.ps1
      - name: Check preset pruning
        shell: powershell
        run: .\scripts\test_prune_cached_presets.ps1

  build_windows_x64:
    name: Build Windows x64
    needs: check_build_script
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-win-server' || 'windows-latest' }}
      arch: x64
      compiler: clang
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit

  unit_tests_windows_x64:
    name: Windows x64 / Unit Tests
    needs: build_windows_x64
    if: ${{ !cancelled() && success() && !inputs.build-deps-only }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-win-server' || 'windows-latest' }}
      artifact: ${{ github.sha }}-tests-windows-x64

  build_windows_arm64:
    name: Build Windows ARM64
    needs: check_build_script
    if: ${{ inputs.build-arm64 && !vars.SELF_HOSTED }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-11-vs2026-arm
      arch: arm64
      compiler: clang
      build-deps-only: ${{ inputs.build-deps-only }}
    secrets: inherit

  unit_tests_windows_arm64:
    name: Windows ARM64 / Unit Tests
    needs: build_windows_arm64
    if: ${{ !cancelled() && success() && !inputs.build-deps-only }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-11-vs2026-arm
      artifact: ${{ github.sha }}-tests-windows-arm64
      test-dir: build-arm64/tests
