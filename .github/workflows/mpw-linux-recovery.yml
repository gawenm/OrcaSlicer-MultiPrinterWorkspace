name: MPW Linux x86-64 recovery build
on:
  push:
    branches:
      - fix/mpw-manjaro-row-plate-recovery
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
  test:
    needs: build
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ubuntu-24.04
      artifact: ${{ github.sha }}-tests-linux-x86_64
